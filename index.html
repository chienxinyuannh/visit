<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>探視預約</title>
<style>
  :root {
    --bg: #f2f7f9; --card: #ffffff; --ink: #1f2f3a; --sub: #5e7280; --line: #d6e3ea;
    --main: #2f6f8a; --main-2: #4f97ad; --soft: #e2f0f4; --warn: #a1532f; --warn-bg: #fbeee6;
    --ok: #2d6a55; --ok-bg: #e3f3ec; --dis: #b9c6cd;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.6 "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; -webkit-text-size-adjust: 100%; }
  header { background: var(--main); color: #fff; padding: 14px 16px 12px; }
  header .org { font-size: 14px; opacity: .85; }
  header h1 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: 1px; }
  main { padding: 12px 14px 40px; max-width: 560px; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  h2 { font-size: 18px; margin: 0 0 8px; color: var(--main); }
  .tabs { display: flex; background: var(--soft); border-radius: 10px; padding: 4px; margin-bottom: 12px; }
  .tabs button { flex: 1; border: 0; background: transparent; padding: 10px 4px; font: inherit; font-weight: 600; color: var(--sub); border-radius: 8px; }
  .tabs button.on { background: var(--card); color: var(--main); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  label { display: block; font-weight: 600; margin: 12px 0 4px; }
  label .opt { font-weight: 400; color: var(--sub); font-size: 14px; }
  input, select { width: 100%; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); }
  input:focus, select:focus { outline: 2px solid var(--main-2); border-color: transparent; }
  .btn { display: block; width: 100%; margin-top: 16px; padding: 13px; border: 0; border-radius: 10px; background: var(--main); color: #fff; font: inherit; font-weight: 700; font-size: 18px; }
  .btn:disabled { background: var(--dis); }
  .btn.ghost { background: #fff; color: var(--main); border: 1px solid var(--main); }
  .btn.warn { background: var(--warn); }
  .row { display: flex; gap: 8px; } .row > * { flex: 1; }
  .hint { color: var(--sub); font-size: 14px; margin-top: 4px; }
  .msg { border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; white-space: pre-wrap; }
  .msg.ok { background: var(--ok-bg); color: var(--ok); } .msg.err { background: var(--warn-bg); color: var(--warn); } .msg.info { background: var(--soft); color: var(--main); }
  .people { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 8px 14px; font: inherit; color: var(--ink); }
  .chip.on { background: var(--main); border-color: var(--main); color: #fff; }
  .dates { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px; -webkit-overflow-scrolling: touch; }
  .date { flex: 0 0 66px; border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 0; text-align: center; font: inherit; color: var(--ink); }
  .date b { display: block; font-size: 18px; } .date small { font-size: 13px; color: var(--sub); }
  .date.on { background: var(--main); border-color: var(--main); color: #fff; } .date.on small { color: #e6f2f6; }
  .date:disabled { background: #eef2f4; color: var(--dis); } .date:disabled small { color: var(--dis); }
  .slots { display: grid; gap: 8px; }
  .slot { display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 12px 14px; font: inherit; color: var(--ink); text-align: left; }
  .slot .t { font-weight: 700; font-size: 18px; } .slot .n { font-size: 14px; color: var(--sub); }
  .slot.on { border: 2px solid var(--main); background: var(--soft); }
  .slot:disabled { background: #f1f4f6; color: var(--dis); } .slot:disabled .n { color: var(--dis); }
  .bk { border-left: 4px solid var(--main-2); }
  .bk .when { font-size: 19px; font-weight: 700; }
  .bk .who { color: var(--sub); }
  .bk .acts { display: flex; gap: 8px; } .bk .acts .btn { margin-top: 10px; padding: 10px; font-size: 16px; }
  .tag { display: inline-block; font-size: 13px; padding: 1px 8px; border-radius: 999px; background: var(--soft); color: var(--main); margin-left: 6px; vertical-align: 2px; }
  .tag.wait { background: var(--warn-bg); color: var(--warn); }
  details { margin-top: 12px; font-size: 14px; color: var(--sub); }
  details summary { color: var(--main); }
  .check { display: flex; gap: 8px; align-items: flex-start; margin-top: 12px; font-weight: 400; }
  .check input { width: 22px; height: 22px; flex: 0 0 22px; margin-top: 2px; }
  .link { background: none; border: 0; color: var(--main); font: inherit; text-decoration: underline; padding: 8px 0; }
  .mask { position: fixed; inset: 0; background: rgba(20,40,50,.45); display: flex; align-items: flex-end; justify-content: center; z-index: 10; }
  .sheet { background: var(--bg); width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; border-radius: 16px 16px 0 0; padding: 16px 14px 28px; }
  .center { text-align: center; color: var(--sub); padding: 40px 0; }
  .spin { width: 34px; height: 34px; border: 4px solid var(--soft); border-top-color: var(--main); border-radius: 50%; margin: 0 auto 12px; animation: s 1s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  .hide { display: none !important; }
  .msg.alert { background: #fff3dc; color: #8a5400; }
  .bk.off { border-left-color: var(--warn); opacity: .85; }
  footer a { color: var(--main); }
  header { position: relative; }
  .sync { position: absolute; right: 16px; bottom: 12px; font-size: 13px; opacity: .85; }
  footer { max-width: 560px; margin: 0 auto; padding: 0 14px 30px; color: var(--sub); font-size: 14px; }
</style>
</head>
<body>
<header><div class="org" id="org">芊馨園護理之家</div><h1>探視預約</h1><div id="sync" class="sync hide">更新中…</div></header>
<main id="app"><div class="center"><div class="spin"></div>載入中…</div></main>
<footer id="foot"></footer>
<div id="layer"></div>

<script>
/* ===== 設定（上架前填寫） ===== */
const API_URL = 'https://script.google.com/macros/s/AKfycbxjYCeQ1JQhUKijRd0XmPwTbJZuIkvlzU6F33PFh9XvNuKpX1k6iYmeSnetIC6BNN6Q/exec';   // Apps Script 部署網址（結尾 /exec）
/* ============================== */

const QS = new URLSearchParams(location.search);
const API = QS.get('api') || API_URL;   // ?api= 僅供測試
const KEY = 'cxy_visit_token';

const S = { token: '', me: null, days: null, tab: 'book', bed: '', date: '', slot: '', flash: null, keep: null };
const app = document.getElementById('app');
const layer = document.getElementById('layer');

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* 記住這支手機：登入代碼存在本機瀏覽器；無法存取時本次有效 */
/* ---------- 加速：手機記住上次的資料，打開先顯示，背景再更新 ---------- */
const CKEY = 'cxy_visit_cache';
function todayTW() { try { return new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Taipei' }); } catch (e) { return ''; } }
function saveCache() {
  try {
    if (!S.token || !S.me) return;
    localStorage.setItem(CKEY, JSON.stringify({ t: S.token.slice(-16), at: Date.now(), me: S.me, days: S.days }));
  } catch (e) { /* 無痕模式等情況：不記也沒關係 */ }
}
function loadCache() {
  try {
    const c = JSON.parse(localStorage.getItem(CKEY) || 'null');
    if (!c || c.t !== S.token.slice(-16) || Date.now() - c.at > 86400000 || !c.me) return null;
    if (c.days && (!c.days.length || c.days[0].date !== todayTW())) c.days = null; // 名額只用今天的
    return c;
  } catch (e) { return null; }
}
function clearCache() { try { localStorage.removeItem(CKEY); } catch (e) {} }
function syncing(on) { const el = document.getElementById('sync'); if (el) el.classList.toggle('hide', !on); }
/** 收到後端帶回的「我的資料＋名額」。 */
function takeMe(me) {
  S.me = me;
  if (me && me.days) { S.days = me.days; delete me.days; }
}

function loadToken() { try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } }
function saveToken(t) { try { if (t) localStorage.setItem(KEY, t); else localStorage.removeItem(KEY); } catch (e) {} }

async function api(action, data) {
  const body = Object.assign({ action: action, token: S.token }, data || {});
  let res;
  try {
    const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
    res = await r.json();
  } catch (e) {
    throw new Error('網路連線不穩，請稍後再試');
  }
  if (!res.ok) {
    const err = new Error(res.error || '系統忙碌中，請稍後再試');
    err.code = res.code;
    throw err;
  }
  return res;
}

function fatal(text) { app.innerHTML = '<div class="msg err">' + esc(text) + '</div><button class="btn ghost" onclick="location.reload()">重新整理</button>'; }

/* ---------- 啟動 ---------- */
async function start() {
  if (!API) return fatal('預約頁尚未設定完成，請洽社工。');
  S.token = loadToken();
  if (!S.token) {
    api('info').then(setOrg).catch(() => {});
    S.me = null; render(); return;
  }
  const c = loadCache();
  if (c) {
    // 先用上次的資料畫出來，背景再更新
    S.me = c.me; S.days = c.days || null;
    const ok = approved();
    if (ok.length && !ok.some(b => b.bed === S.bed)) S.bed = ok[0].bed;
    setOrg(S.me);
    if (!ok.length || S.days) render();
    syncing(true);
    await reload(undefined, true);
    syncing(false);
    return;
  }
  await reload();
}

function setOrg(r) {
  if (r && r.orgName) document.getElementById('org').textContent = r.orgName;
  const tel = r && r.tel;
  document.getElementById('foot').innerHTML = (tel ? '聯絡社工：<a href="tel:' + esc(tel.replace(/[^\d#]/g, '')) + '">' + esc(tel) + '</a>' : '') +
    (S.me ? '<br>目前登入手機 ' + esc(S.me.phone) + '　<button class="link" id="logout">登出</button>' : '');
  const lo = document.getElementById('logout');
  if (lo) lo.onclick = logout;
}

async function reload(flash, background) {
  if (flash !== undefined) S.flash = flash;
  try {
    const r = await api('me', { withDays: true });
    if (!r.days) S.days = null; // 後端是舊版：名額另外問
    takeMe(r);
    if (background) keep();
    await afterMe();
  } catch (e) {
    if (e.code === 'LOGIN') { saveToken(''); clearCache(); S.token = ''; S.me = null; S.days = null; render(); return; }
    if (background && S.me) { toast('網路不穩，畫面是上次的資料，請稍後重新整理'); return; }
    fatal(e.message);
  }
}

async function afterMe() {
  setOrg(S.me);
  const ok = approved();
  if (ok.length && !ok.some(b => b.bed === S.bed)) S.bed = ok[0].bed;
  if (ok.length && !S.days) S.days = (await api('availability')).days; // 後端是舊版時才會走到這裡
  saveCache();
  render();
}

async function logout() {
  sheet('<h2>登出這支手機？</h2><div class="hint">登出後要再預約，需重新輸入住民姓名與手機。借用別人手機時請記得登出。</div>' +
    '<button class="btn warn" id="lo_go">登出</button><button class="btn ghost" id="lo_no">不要登出</button>');
  document.getElementById('lo_no').onclick = closeSheet;
  document.getElementById('lo_go').onclick = async () => {
    try { await api('logout'); } catch (e) {}
    saveToken(''); clearCache(); S.token = ''; S.me = null; S.days = null; S.tab = 'book';
    closeSheet(); setOrg(null); render();
  };
}

const approved = () => (S.me ? S.me.bindings.filter(b => b.status === '已核准') : []);
const pending = () => (S.me ? S.me.bindings.filter(b => b.status === '待審核') : []);

function render() {
  const flash = S.flash ? '<div class="msg ' + S.flash.type + '">' + esc(S.flash.text) + '</div>' : '';
  S.flash = null;
  if (!S.me) { app.innerHTML = flash + loginView(); formEvents('login'); return; }
  if (S.tab === 'bind') { app.innerHTML = flash + addView(); formEvents('addResident'); return; }
  if (!approved().length) {
    app.innerHTML = flash + pendingView() +
      '<div class="card"><h2>尚無可預約的住民</h2><div class="hint">綁定審核通過後，重新打開本頁即可預約。</div>' +
      '<button class="btn ghost" id="refresh">重新整理</button></div>' +
      '<button class="link" data-tab="bind">＋ 綁定其他住民</button>';
    document.getElementById('refresh').onclick = () => reload();
    app.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; render(); });
    return;
  }
  const mineCount = S.me.bookings.filter(b => b.status === '已預約').length;
  app.innerHTML = flash +
    '<div class="tabs"><button data-tab="book" class="' + (S.tab === 'book' ? 'on' : '') + '">預約探視</button>' +
    '<button data-tab="mine" class="' + (S.tab === 'mine' ? 'on' : '') + '">我的預約' + (mineCount ? '（' + mineCount + '）' : '') + '</button></div>' +
    (S.tab === 'book' ? bookView() : mineView()) +
    pendingView() +
    '<button class="link" data-tab="bind">＋ 綁定其他住民</button>';
  app.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; render(); window.scrollTo(0, 0); });
  if (S.tab === 'book') bookEvents(); else mineEvents();
}

function pendingView() {
  const p = pending();
  if (!p.length) return '';
  return '<div class="msg info">' + p.map(b => esc(b.resident) + ' 的綁定申請審核中').join('\n') + '</div>';
}

/* ---------- 登入（第一次使用、換手機）與新增住民 ---------- */
const PRIVACY = '芊馨園護理之家為辦理住民探視預約與聯繫，蒐集您的姓名、與住民的關係及手機號碼。' +
  '資料僅於本機構提供探視預約服務期間，在臺灣地區由本機構人員用於確認家屬身分、安排探視與聯繫，不提供給其他單位。' +
  '您可以隨時向本機構社工請求查詢、閱覽、更正、停止利用或刪除您的資料。' +
  '若不提供，將無法使用線上預約，仍可來電由櫃台代為預約。';

const RELATIONS = ['兒子', '女兒', '媳婦', '女婿', '配偶', '孫子', '孫女', '兄弟姊妹', '其他親屬', '朋友'];

function personFields(withPhone) {
  return '<label>住民姓名</label><input id="f_res" autocomplete="off" placeholder="住民全名">' +
    '<label>護號 <span class="opt">（選填，例 00068）</span></label><input id="f_pid" autocomplete="off" autocapitalize="characters">' +
    '<label>您的姓名</label><input id="f_fam" autocomplete="name">' +
    '<label>您與住民的關係</label><select id="f_rel"><option value="">請選擇</option>' +
    RELATIONS.map(x => '<option>' + x + '</option>').join('') + '</select>' +
    (withPhone ? '<label>手機號碼</label><input id="f_tel" type="tel" inputmode="numeric" placeholder="09xx-xxx-xxx" autocomplete="tel">' : '');
}

function loginView() {
  return '<div class="card"><h2>請先確認身分</h2>' +
    '<div class="hint">第一次使用或換了手機，請填寫以下資料。手機號碼請填登記在機構的號碼，系統會自動比對；比對不到時由社工審核。</div>' +
    personFields(true) +
    '<details><summary>個人資料蒐集告知</summary><p>' + PRIVACY + '</p></details>' +
    '<label class="check"><input type="checkbox" id="f_ok"><span>我已閱讀並同意個人資料蒐集告知</span></label>' +
    '<div class="hint">送出後，這支手機會記住您的身分，下次打開不用再填。</div>' +
    '<button class="btn" id="f_go">送出</button></div>';
}

function addView() {
  return '<div class="card"><h2>綁定其他住民</h2><div class="hint">使用目前登入的手機 ' + esc(S.me.phone) + ' 比對。</div>' +
    personFields(false) +
    '<button class="btn" id="f_go">送出</button><button class="btn ghost" data-tab="book">返回</button></div>';
}

function formEvents(action) {
  app.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; render(); });
  const go = document.getElementById('f_go');
  go.onclick = async () => {
    const v = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
    if (!v('f_res') || !v('f_fam') || !v('f_rel') || (action === 'login' && !v('f_tel'))) return toast('請把資料填寫完整');
    if (action === 'login') {
      if (!/^09\d{8}$/.test(v('f_tel').replace(/\D/g, ''))) return toast('手機號碼格式不正確（09 開頭 10 碼）');
      if (!document.getElementById('f_ok').checked) return toast('請勾選同意個人資料蒐集告知');
    }
    go.disabled = true; go.textContent = '送出中…';
    try {
      const r = await api(action, { resident: v('f_res'), pid: v('f_pid'), family: v('f_fam'), relation: v('f_rel'), phone: v('f_tel'), withDays: true });
      if (r.token) { S.token = r.token; saveToken(r.token); }
      S.days = null; takeMe(r); S.tab = 'book';
      S.flash = { type: r.status === '已核准' ? 'ok' : 'info', text: r.message };
      await afterMe();
    } catch (e) {
      go.disabled = false; go.textContent = '送出'; toast(e.message);
    }
  };
}

/* ---------- 選日期與時段（預約、改期共用） ---------- */
/* ---------- 週末分流（只提醒，不限制） ---------- */
function splitCfg() {
  const c = S.me && S.me.split;
  return c && c.on ? c : null;
}
function isWeekend(date) { const w = new Date(date + 'T12:00:00+08:00').getUTCDay(); return w === 0 || w === 6; }
/** 週六、週日：奇數日、偶數日各開放哪些樓層；平日回傳 null。 */
function splitFloors(date) {
  const c = splitCfg();
  if (!c || !isWeekend(date)) return null;
  return Number(date.slice(8, 10)) % 2 ? c.odd : c.even;
}
/** 日期與住民實際樓層（後端提供，5xx 房在 4 樓）不符時的提醒文字；相符或平日回傳 ''。 */
function splitWarn(date, floor, resident) {
  const floors = splitFloors(date);
  if (!floors || !floor) return '';
  const f = String(floor);
  if (floors.indexOf(f) >= 0) return '';
  const d = (S.days || []).find(x => x.date === date);
  return (d ? d.label : date) + ' 是 ' + floors.join('、') + ' 樓的訪客日，' + resident + ' 住在 ' + f + ' 樓，建議改選其他日期。';
}
function splitRule() {
  const c = splitCfg();
  return c ? '週六、週日分樓層探視：單號日 ' + c.odd.join('、') + ' 樓，雙號日 ' + c.even.join('、') + ' 樓。' : '';
}
/** 送出前再提醒一次；按「仍要預約」才繼續。 */
function splitConfirm(text, okLabel, onYes, onBack) {
  hideToast();
  sheet('<h2>提醒</h2><div class="msg alert">' + esc(text) + '</div>' +
    '<button class="btn" id="sp_yes">' + okLabel + '</button><button class="btn ghost" id="sp_no">返回修改</button>');
  document.getElementById('sp_yes').onclick = onYes;
  document.getElementById('sp_no').onclick = onBack || closeSheet;
}

function pickerHtml(prefix, date, slot, floor, resident) {
  const days = S.days || [];
  const d = days.find(x => x.date === date);
  const warn = splitWarn(date, floor, resident);
  let h = '<label>日期</label>' + (splitRule() ? '<div class="hint" style="margin:-2px 0 6px">' + esc(splitRule()) + '</div>' : '') +
    '<div class="dates">' + days.map(x => {
    const any = x.slots.some(s => s.bookable);
    const m = x.label.match(/^(\d+)\/(\d+)（(.)）/);
    return '<button class="date' + (x.date === date ? ' on' : '') + '" data-' + prefix + 'date="' + x.date + '"' + (any ? '' : ' disabled') + '>' +
      '<small>' + Number(m[1]) + '月</small><b>' + Number(m[2]) + '</b><small>週' + m[3] + '</small></button>';
  }).join('') + '</div>' + (warn ? '<div class="msg alert" style="margin:4px 0 0">' + esc(warn) + '</div>' : '');
  if (d) {
    h += '<label>時段</label><div class="slots">' + d.slots.filter(s => s.open || s.reason !== '此時段不開放').map(s =>
      '<button class="slot' + (s.code === slot ? ' on' : '') + '" data-' + prefix + 'slot="' + s.code + '"' + (s.bookable ? '' : ' disabled') + '>' +
      '<span class="t">' + esc(s.label.slice(2)) + '</span><span class="n">' + (s.bookable ? '剩 ' + s.left + ' 組' : esc(s.reason)) + '</span></button>').join('') + '</div>';
  }
  return h;
}

function firstOpenDate() { const d = (S.days || []).find(x => x.slots.some(s => s.bookable)); return d ? d.date : ''; }

/* ---------- 預約 ---------- */
function bookView() {
  const list = approved();
  const cur = list.find(b => b.bed === S.bed) || list[0];
  if (!S.date || !(S.days || []).some(d => d.date === S.date && d.slots.some(s => s.bookable))) S.date = firstOpenDate();
  let h = '<div class="card">';
  if (list.length > 1) {
    h += '<label style="margin-top:0">探視住民</label><div class="people">' +
      list.map(b => '<button class="chip' + (b.bed === cur.bed ? ' on' : '') + '" data-bed="' + esc(b.bed) + '">' + esc(b.resident) + '</button>').join('') + '</div>';
  } else {
    h += '<h2>探視 ' + esc(cur.resident) + '</h2>';
  }
  if (cur.hospitalized) {
    return h + '<div class="msg err" style="margin-top:12px">住民目前住院中，暫停探視預約。如需協助請洽社工。</div></div>';
  }
  if (!S.date) return h + '<div class="msg info" style="margin-top:12px">近期沒有可預約的時段。</div></div>';
  h += pickerHtml('', S.date, S.slot, cur.floor, cur.resident);
  const max = S.me.maxVisitors || 4;
  h += '<div class="row"><div><label>人數</label><select id="b_n">' +
    Array.from({ length: max }, (_, i) => '<option>' + (i + 1) + '</option>').join('') + '</select></div><div></div></div>' +
    '<label>備註 <span class="opt">（選填，例：輪椅、帶外食）</span></label><input id="b_note" maxlength="100">' +
    '<button class="btn" id="b_go"' + (S.slot ? '' : ' disabled') + '>確認預約</button>' +
    '<div class="hint">當天的預約只受理到 ' + (S.me.sameDayCutoff || '08:00') +
    '，之後請直接與機構聯繫。預約後可在「我的預約」取消或改期（當天的到 ' + (S.me.sameDayCutoff || '08:00') + ' 為止）。</div></div>';
  return h;
}

function bookEvents() {
  app.querySelectorAll('[data-bed]').forEach(b => b.onclick = () => { S.bed = b.dataset.bed; S.slot = ''; keep(); render(); });
  app.querySelectorAll('[data-date]').forEach(b => b.onclick = () => {
    S.date = b.dataset.date; S.slot = ''; keep(); render();
    const cur = approved().find(x => x.bed === S.bed);
    const w = cur && splitWarn(S.date, cur.floor, cur.resident);
    if (w) toast(w, 'alert');
  });
  app.querySelectorAll('[data-slot]').forEach(b => b.onclick = () => { S.slot = b.dataset.slot; keep(); render(); });
  showActiveDate(app);
  const n = document.getElementById('b_n'), note = document.getElementById('b_note');
  if (n && S.keep) { n.value = S.keep.n; note.value = S.keep.note; }
  S.keep = null;
  const go = document.getElementById('b_go');
  if (!go) return;
  const submit = async () => {
    closeSheet();
    go.disabled = true; go.textContent = '預約中…';
    try {
      const r = await api('book', { bed: S.bed, date: S.date, slot: S.slot, visitors: n.value, note: note.value.trim(), withMe: true });
      S.slot = ''; S.days = null; S.tab = 'mine';
      const flash = { type: 'ok', text: '預約成功\n' + summary(r.booking) + (r.booking.lateHint ? '\n\n' + r.booking.lateHint : '') };
      if (r.me) { takeMe(r.me); S.flash = flash; await afterMe(); } else await reload(flash);
    } catch (e) {
      toast(e.message);
      try { S.days = (await api('availability')).days; } catch (x) {}
      keep(); render();
    }
  };
  go.onclick = () => {
    const cur = approved().find(x => x.bed === S.bed);
    const w = cur && splitWarn(S.date, cur.floor, cur.resident);
    if (w) splitConfirm(w + '\n\n確定仍要預約這一天嗎？', '仍要預約', submit);
    else submit();
  };
}

// 切換住民、日期、時段時保留已填的人數、備註
function keep() {
  const n = document.getElementById('b_n'), note = document.getElementById('b_note');
  if (n) S.keep = { n: n.value, note: note.value };
}

function summary(b) {
  return b.dateLabel + ' ' + b.slotLabel.slice(2) + '\n' + b.resident + '　' + b.visitors + ' 位' + (b.note ? '（' + b.note + '）' : '') + '\n編號 ' + b.id;
}

/* ---------- 我的預約 ---------- */
function mineView() {
  const list = S.me.bookings;
  if (!list.length) return '<div class="card center" style="padding:28px 0">目前沒有預約</div>';
  return list.map(b => {
    const off = b.status !== '已預約';
    return '<div class="card bk' + (off ? ' off' : '') + '"><div class="when">' + esc(b.dateLabel) + ' ' + esc(b.slotLabel.slice(2)) +
      (off ? '<span class="tag wait">已取消</span>' : '') + '</div>' +
      '<div class="who">' + esc(b.resident) + '　' + b.visitors + ' 位' + (b.note ? '（' + esc(b.note) + '）' : '') + '<br>編號 ' + esc(b.id) + '</div>' +
      (off ? '<div class="msg err" style="margin:10px 0 0">' + esc(b.cancelReason || '已由機構取消') + '，請改選其他時段，造成不便敬請見諒。</div>' :
        b.locked ? '<div class="msg alert" style="margin:10px 0 0">當天預約已無法線上變更，如無法前來，請來電告知' +
          (S.me.tel ? '：<a href="tel:' + esc(S.me.tel.replace(/[^\d#]/g, '')) + '">' + esc(S.me.tel) + '</a>' : '') + '。</div>' :
        '<div class="acts"><button class="btn ghost" data-move="' + esc(b.id) + '">改期</button>' +
        '<button class="btn warn" data-cancel="' + esc(b.id) + '">取消</button></div>') + '</div>';
  }).join('');
}

function mineEvents() {
  app.querySelectorAll('[data-cancel]').forEach(b => b.onclick = () => cancelSheet(b.dataset.cancel));
  app.querySelectorAll('[data-move]').forEach(b => b.onclick = () => moveSheet(b.dataset.move));
}

function sheet(html) {
  layer.innerHTML = '<div class="mask"><div class="sheet">' + html + '</div></div>';
  layer.querySelector('.mask').onclick = e => { if (e.target.classList.contains('mask')) closeSheet(); };
}
function closeSheet() { layer.innerHTML = ''; }

function cancelSheet(id) {
  const b = S.me.bookings.find(x => x.id === id);
  sheet('<h2>確定取消這筆預約？</h2><div class="card">' + esc(summary(b)).replace(/\n/g, '<br>') + '</div>' +
    '<button class="btn warn" id="c_go">確定取消</button><button class="btn ghost" id="c_no">不要取消</button>');
  document.getElementById('c_no').onclick = closeSheet;
  const go = document.getElementById('c_go');
  go.onclick = async () => {
    go.disabled = true; go.textContent = '取消中…';
    try {
      const r = await api('cancel', { id: id, withMe: true });
      closeSheet(); S.days = null;
      const flash = { type: 'ok', text: '已取消 ' + b.dateLabel + ' ' + b.slotLabel.slice(2) + ' 的預約' };
      if (r.me) { takeMe(r.me); S.flash = flash; await afterMe(); } else await reload(flash);
    } catch (e) { closeSheet(); toast(e.message); }
  };
}

async function moveSheet(id) {
  const b = S.me.bookings.find(x => x.id === id);
  const st = { date: '', slot: '' };
  const fresh = api('availability').then(r => r.days);
  if (!S.days) { try { S.days = await fresh; } catch (e) { return toast(e.message); } }
  st.date = firstOpenDate();
  const draw = () => {
    sheet('<h2>改期</h2><div class="hint">原預約：' + esc(b.dateLabel + ' ' + b.slotLabel.slice(2)) + '</div>' +
      pickerHtml('m', st.date, st.slot, b.floor, b.resident) +
      '<button class="btn" id="m_go"' + (st.slot ? '' : ' disabled') + '>確認改期</button><button class="btn ghost" id="m_no">返回</button>');
    layer.querySelectorAll('[data-mdate]').forEach(x => x.onclick = () => {
      st.date = x.dataset.mdate; st.slot = ''; draw();
      const w = splitWarn(st.date, b.floor, b.resident);
      if (w) toast(w, 'alert');
    });
    layer.querySelectorAll('[data-mslot]').forEach(x => x.onclick = () => { st.slot = x.dataset.mslot; draw(); });
    showActiveDate(layer);
    document.getElementById('m_no').onclick = closeSheet;
    const go = document.getElementById('m_go');
    const submit = async () => {
      sheet('<div class="center"><div class="spin"></div>改期中…</div>');
      try {
        const r = await api('reschedule', { id: id, date: st.date, slot: st.slot, withMe: true });
        closeSheet(); S.days = null;
        const flash = { type: 'ok', text: '改期成功\n' + summary(r.booking) + (r.booking.lateHint ? '\n\n' + r.booking.lateHint : '') };
        if (r.me) { takeMe(r.me); S.flash = flash; await afterMe(); } else await reload(flash);
      } catch (e) { draw(); toast(e.message); }
    };
    go.onclick = () => {
      const w = splitWarn(st.date, b.floor, b.resident);
      if (w) splitConfirm(w + '\n\n確定仍要改到這一天嗎？', '仍要改期', submit, draw);
      else submit();
    };
  };
  draw();
  // 先用手上的名額畫出來，最新名額回來後再更新（使用者還在這個畫面才重畫）
  fresh.then(days => {
    S.days = days;
    if (!document.getElementById('m_go')) return;
    const d = days.find(x => x.date === st.date);
    const s = d && d.slots.find(x => x.code === st.slot);
    if (!d) st.date = firstOpenDate();
    if (st.slot && !(s && s.bookable)) st.slot = '';
    draw();
  }).catch(() => {});
}

function hideToast() { const t = document.getElementById('toast'); if (t) t.classList.add('hide'); }
/** 讓選到的日期出現在橫向日期列的可見範圍內。 */
function showActiveDate(root) {
  const el = (root || document).querySelector('.date.on');
  if (el && el.parentNode) el.parentNode.scrollLeft = el.offsetLeft - el.parentNode.offsetLeft - 8;
}
let toastTimer;
function toast(text, kind) {
  let t = document.getElementById('toast');
  if (!t) {
    t = document.createElement('div'); t.id = 'toast'; t.className = 'msg err';
    t.style.cssText = 'position:fixed;left:14px;right:14px;bottom:18px;z-index:20;box-shadow:0 4px 14px rgba(0,0,0,.15);max-width:532px;margin:0 auto';
    document.body.appendChild(t);
  }
  t.className = 'msg ' + (kind || 'err');
  t.textContent = text; t.classList.remove('hide');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.add('hide'), 4000);
}

start();
</script>
</body>
</html>
